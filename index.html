    <meta name="theme-color" content="#f8fafc">
    <script>
        // 在第一帧之前决定深浅色，否则选了深色的人每次打开都会先闪一下白屏。
        // 和 App.jsx 里的外观设置读同一个键；存储不可用时按系统来。
        (function () {
            var pref = 'system';
            try { pref = localStorage.getItem('pfl_appearance') || 'system'; } catch (e) { }
            var systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (pref === 'dark' || (pref === 'system' && systemDark)) {
                document.documentElement.classList.add('theme-dark');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f172a');
            }
        })();
    </script>
    <link rel="stylesheet" href="./src/styles.css?v=v620-schulte-haptics-20260922a">
    <link rel="stylesheet" href="./src/theme-dark.css?v=v620-schulte-haptics-20260922a">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 只带 border、不写颜色的元素（规则弹窗里的示例框等）用的是 Tailwind 的默认描边色。
        // 把它换成变量，浅色下仍是原来的 #e5e7eb，深色下由 theme-dark.css 改成描边色。
        tailwind.config = { theme: { extend: { borderColor: { DEFAULT: 'var(--pfl-default-border, #e5e7eb)' } } } };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
